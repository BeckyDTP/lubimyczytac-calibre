name: Zgłoszenie błędu
description: Opisz problem z działaniem wtyczki.
title: "[Błąd] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Przed zgłoszeniem sprawdź, czy podobny problem nie został już opisany.
        Nie wklejaj haseł, danych osobowych ani innych poufnych informacji.
  - type: input
    id: calibre
    attributes:
      label: Wersja Calibre
      placeholder: "np. 9.16"
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Wersja wtyczki
      placeholder: "np. 2.4.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: System operacyjny
      placeholder: "np. Windows 11, Linux, macOS"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Opis problemu
      description: Co się stało? Jeśli problem dotyczy książki, podaj jej tytuł, autora i publiczny adres strony w LubimyCzytać.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Kroki odtworzenia
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Oczekiwany rezultat
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Rzeczywisty rezultat i log
      description: Wklej odpowiedni fragment logu pobierania metadanych. Usuń dane prywatne.
    validations:
      required: true
